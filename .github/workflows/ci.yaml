name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - uses: azure/setup-helm@v4
      - run: make chart-lint chart-template >/dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/binhphuong/rke-nodegroup-autoscaler
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # one version everywhere: tag vX.Y.Z == Chart.yaml version == appVersion == image tag
      - name: check versions
        run: make check-version TAG="${{ github.ref_name }}"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (access token with write scope)
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE }}:latest
      - uses: azure/setup-helm@v4
      - name: push chart
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login registry-1.docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          helm package charts/rke-nodegroup-autoscaler
          helm push "rke-nodegroup-autoscaler-${{ steps.meta.outputs.version }}.tgz" "oci://registry-1.docker.io/${{ secrets.DOCKERHUB_USERNAME }}"
