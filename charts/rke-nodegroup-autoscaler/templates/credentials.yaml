{{- if include "ngas.createCredentials" . }}
{{- $cr := include "ngas.credentials" . | fromYaml }}
# Created only when the cloud credentials are set in values (for testing). The usual way is a Secret created
# out of band and referenced by <cloud>.credentials.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cr.secret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ngas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ index $cr.keys 0 }}: {{ index $cr.values 0 | quote }}
  {{ index $cr.keys 1 }}: {{ index $cr.values 1 | quote }}
{{- end }}
