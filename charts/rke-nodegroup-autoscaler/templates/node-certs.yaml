{{- if and .Values.nodeCerts.files (not .Values.nodeCerts.hostPath) }}
# Created only when nodeCerts.files is set in values. The shared RKE node certificates (kube-node,
# kube-proxy) that every new node gets through its join script.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngas.nodeCertsSecret" $ }}
  namespace: {{ $.Release.Namespace }}
  labels: {{- include "ngas.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $name := splitList " " (include "ngas.certFileNames" $) }}
  {{ $name }}: {{ index $.Values.nodeCerts.files $name | quote }}
  {{- end }}
{{- end }}
