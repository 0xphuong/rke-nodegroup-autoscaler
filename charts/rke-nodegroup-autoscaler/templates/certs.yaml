{{- include "ngas.validate" . -}}
{{- /*
One private CA for this release, kept across upgrades (lookup). It signs:
  - the provider's gRPC server certificate and cluster-autoscaler's client certificate (mTLS),
  - the bootstrap server certificate new VMs verify (IP SANs = bootstrap.nodeIPs).
The leaf certificates are kept across upgrades too (see ngas.leafCert), so an upgrade that changes nothing leaves
these Secrets unchanged. lookup only works against a live cluster: `helm template` and client-side dry runs
always show fresh certificates.
*/ -}}
{{- $fn := include "ngas.fullname" . -}}
{{- $ns := .Release.Namespace -}}
{{- $svc := include "ngas.provider" . -}}
{{- $t := include "ngas.tls" . | fromYaml -}}
{{- $ca := $t.ca -}}
{{- $grpcServer := $t.grpcServer -}}
{{- $grpcClient := $t.grpcClient -}}
{{- $boot := $t.boot -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-ca
  namespace: {{ $ns }}
  labels: {{- include "ngas.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $ca.cert | b64enc }}
  tls.key: {{ $ca.key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $svc }}-grpc-tls
  namespace: {{ $ns }}
  labels: {{- include "ngas.labels" . | nindent 4 }}
  annotations: {{- include "ngas.leafCertAnnotations" $grpcServer | nindent 4 }}
type: Opaque
data:
  tls.crt: {{ $grpcServer.cert | b64enc }}
  tls.key: {{ $grpcServer.key | b64enc }}
  ca.crt: {{ $ca.cert | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $svc }}-bootstrap-tls
  namespace: {{ $ns }}
  labels: {{- include "ngas.labels" . | nindent 4 }}
  annotations: {{- include "ngas.leafCertAnnotations" $boot | nindent 4 }}
type: Opaque
data:
  tls.crt: {{ $boot.cert | b64enc }}
  tls.key: {{ $boot.key | b64enc }}
  ca.crt: {{ $ca.cert | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ngas.autoscaler" . }}-grpc
  namespace: {{ $ns }}
  labels: {{- include "ngas.labels" . | nindent 4 }}
  annotations: {{- include "ngas.leafCertAnnotations" $grpcClient | nindent 4 }}
type: Opaque
data:
  tls.crt: {{ $grpcClient.cert | b64enc }}
  tls.key: {{ $grpcClient.key | b64enc }}
  ca.crt: {{ $ca.cert | b64enc }}
  # externalgrpc cloud provider configuration (cluster-autoscaler --cloud-config)
  cloud-config: {{ include "ngas.cloudConfig" . | b64enc }}
